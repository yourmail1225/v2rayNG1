name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        run: |
          set -euo pipefail
          # GitHub-hosted runners ship a fully licensed Android SDK and NDK. The
          # third-party setup-android action regressed (it tries to install the now
          # removed legacy 'tools' SDK package), so export the preinstalled tools.
          NDK_DIR=$(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -n1)
          test -n "$NDK_DIR"
          echo "Using Android SDK: $ANDROID_HOME"
          echo "Using Android NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch and verify AndroidLibXrayLite AAR
        run: |
          mkdir -p V2rayNG/app/libs
          
          # Download official release asset from GitHub API
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*aar" | cut -d : -f 2,3 | tr -d '\" ' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.2.21/AndroidLibXrayLite.aar"
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -f -o V2rayNG/app/libs/AndroidLibXrayLite.aar "$DOWNLOAD_URL"
          
          echo "Verifying downloaded AAR file:"
          ls -lh V2rayNG/app/libs/AndroidLibXrayLite.aar
          file V2rayNG/app/libs/AndroidLibXrayLite.aar

      - name: Compile Tun library
        run: |
          set -euo pipefail
          chmod +x compile-hevtun.sh
          ./compile-hevtun.sh

      - name: Copy HEV tun libraries into app jniLibs
        run: |
          set -euo pipefail
          # compile-hevtun.sh stages libhev-socks5-tunnel.so (in-process JNI for the
          # hev tun mode of TProxyService) and libhevsockstun.so (root-mode engine)
          # under the repository-root libs/. The app module packages jniLibs from
          # V2rayNG/app/libs, so a missing copy means the APK cannot load the hev
          # tunnel and VPN mode crashes with UnsatisfiedLinkError. Fail hard.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "libs/$abi/libhev-socks5-tunnel.so"
            test -f "libs/$abi/libhevsockstun.so"
            mkdir -p "V2rayNG/app/libs/$abi"
            cp "libs/$abi/libhev-socks5-tunnel.so" "V2rayNG/app/libs/$abi/"
            cp "libs/$abi/libhevsockstun.so" "V2rayNG/app/libs/$abi/"
          done
          echo "HEV tun binaries ready:"
          find V2rayNG/app/libs -name 'libhev*' -exec ls -lh {} \;

      - name: Fetch OpenVPN engine binaries
        run: |
          set -euo pipefail

          # libopenvpn.so (the real engine) and libovpnexec.so (the exec shim)
          # come from the gpl-licensed ics-openvpn F-Droid release of
          # de.blinkt.openvpn. The shim dlopens libopenvpn.so via
          # LD_LIBRARY_PATH=nativeLibraryDir at runtime.
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ics-openvpn.apk \
            https://f-droid.org/repo/de.blinkt.openvpn_220.apk

          # Abort on a truncated download (the repo regularly throttles it).
          SIZE=$(stat -c %s /tmp/ics-openvpn.apk)
          if [ "$SIZE" -lt 30000000 ]; then
            echo "OpenVPN APK download is only ${SIZE} bytes, refusing to build"
            exit 1
          fi

          rm -rf /tmp/ics-apk
          mkdir -p /tmp/ics-apk
          unzip -q /tmp/ics-openvpn.apk 'lib/*' 'assets/pie_openvpn.*' -d /tmp/ics-apk

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "V2rayNG/app/libs/$abi"
            cp "/tmp/ics-apk/lib/$abi/libopenvpn.so"  "V2rayNG/app/libs/$abi/"
            cp "/tmp/ics-apk/lib/$abi/libovpnexec.so" "V2rayNG/app/libs/$abi/"
          done

          # Pre-API-28 fallback shims ("exec" and dlopen are unsupported in
          # nativeLibraryDir); kept for the app-side copy fallback.
          mkdir -p "V2rayNG/app/src/main/assets"
          cp /tmp/ics-apk/assets/pie_openvpn.* "V2rayNG/app/src/main/assets/"

          echo "OpenVPN binaries ready:"
          find V2rayNG/app/libs -name 'lib*openvpn*' -exec ls -lh {} \;

      - name: Build Debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon --stacktrace

      - name: Run unit tests
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testFdroidDebugUnitTest --no-daemon

      - name: Validate Play Store debug variant
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug --no-daemon

      - name: Verify native libraries inside APK
        run: |
          set -euo pipefail
          APKS=$(ls V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk)
          echo "APKs:"
          for apk in $APKS; do echo "  $apk"; done
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for lib in libopenvpn.so libovpnexec.so libhev-socks5-tunnel.so libhevsockstun.so libgojni.so; do
              found=0
              for apk in $APKS; do
                if unzip -l "$apk" | grep -q "lib/$abi/$lib"; then
                  found=1
                  break
                fi
              done
              if [ "$found" != "1" ]; then
                echo "ERROR: no APK carries $abi/$lib"
                exit 1
              fi
              echo "$abi/$lib present"
            done
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-OpenVPN-Debug-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
