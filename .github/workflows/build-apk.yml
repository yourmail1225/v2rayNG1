name: Build APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR=$(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -n1)
          test -n "$NDK_DIR"
          echo "Using Android SDK: $ANDROID_HOME"
          echo "Using Android NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Fetch AndroidLibXrayLite AAR
        shell: bash
        run: |
          set -euo pipefail
          pushd AndroidLibXrayLite >/dev/null
          CURRENT_TAG=$(git describe --tags --abbrev=0 || git rev-parse --short HEAD)
          echo "Current tag in this repo: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          popd >/dev/null

          mkdir -p V2rayNG/app/libs
          curl -fL "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar" \
            -o "V2rayNG/app/libs/libv2ray.aar"
          ls -lh "V2rayNG/app/libs/libv2ray.aar"

      - name: Fetch OpenVPN binaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/schwabe/ics-openvpn/releases/download/v0.7.68/ics-openvpn-0.7.68.apk" \
            -o /tmp/ics-openvpn.apk
          test -s /tmp/ics-openvpn.apk

          rm -rf /tmp/ics-apk
          mkdir -p /tmp/ics-apk
          unzip -q /tmp/ics-openvpn.apk 'lib/*' 'assets/pie_openvpn.*' -d /tmp/ics-apk

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "V2rayNG/app/libs/$abi"
            cp "/tmp/ics-apk/lib/$abi/libopenvpn.so" "V2rayNG/app/libs/$abi/"
            cp "/tmp/ics-apk/lib/$abi/libovpnexec.so" "V2rayNG/app/libs/$abi/"
          done

          mkdir -p "V2rayNG/app/src/main/assets"
          cp /tmp/ics-apk/assets/pie_openvpn.* "V2rayNG/app/src/main/assets/"

          echo "OpenVPN binaries ready:"
          find V2rayNG/app/libs -name 'lib*openvpn*' -exec ls -lh {} \;

      - name: Build Debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-daemon --stacktrace

      - name: Run unit tests
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testFdroidDebugUnitTest --no-daemon

      - name: Validate Play Store debug variant
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug --no-daemon

      - name: Verify native libraries inside APK
        shell: bash
        run: |
          set -euo pipefail
          APKS=$(ls V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk)
          echo "APKs:"
          for apk in $APKS; do echo "  $apk"; done

          required_libs=(libopenvpn.so libovpnexec.so)
          optional_libs=(libhev-socks5-tunnel.so libhevsockstun.so libgojni.so)

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for lib in "${required_libs[@]}"; do
              found=0
              for apk in $APKS; do
                if unzip -l "$apk" | grep -q "lib/$abi/$lib"; then
                  found=1
                  break
                fi
              done
              if [ "$found" != "1" ]; then
                echo "ERROR: required native lib missing from APK: $abi/$lib"
                exit 1
              fi
              echo "$abi/$lib present"
            done

            for lib in "${optional_libs[@]}"; do
              found=0
              for apk in $APKS; do
                if unzip -l "$apk" | grep -q "lib/$abi/$lib"; then
                  found=1
                  break
                fi
              done
              if [ "$found" = "1" ]; then
                echo "$abi/$lib present"
              else
                echo "INFO: optional native lib not present in this APK set: $abi/$lib"
              fi
            done
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-OpenVPN-Debug-APK
          path: V2rayNG/app/build/outputs/apk/**/debug/*.apk


















